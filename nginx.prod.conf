events {}

http {
    include         /etc/nginx/mime.types;
    default_type    application/octet-stream;

    upstream mrworld-app {
        server app:8080;
    }

    # http(80)로 들어오면 https로 보냄
    server {
        listen 80;
        listen [::]:80;
        server_name testmaptest.cloud;

        return 301 https://$host$request_uri;
    }

    # https(443)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name testmaptest.cloud;

        # Let's Encrypt 인증서 (EC2의 /etc/letsencrypt를 컨테이너에 마운트)
        ssl_certificate     /etc/letsencrypt/live/testmaptest.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/testmaptest.cloud/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        #백엔드
        location /api/ {
            proxy_pass http://mrworld-app;
            #사용자가 접속한 주소
            proxy_set_header Host $host;
            #실제 사용자의 IP
            proxy_set_header X-Real-IP $remote_addr;
            #요청 거친 IP목록
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            #http로 왔는지 https로 왔는지
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        #Swagger
        location ~ ^/(swagger-ui|v3/api-docs) {
            proxy_pass http://mrworld-app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        #관리자 화면 (빌드된 정적 파일, vite base: /admin/)
        location = /admin {
            return 301 /admin/;
        }
        location /admin/ {
            root /usr/share/nginx/html;
            #새로고침해도 화면이 뜨도록 없는 경로는 관리자 index.html로
            try_files $uri $uri/ /admin/index.html;
        }

        #고객 화면 (빌드된 정적 파일)
        location / {
            root /usr/share/nginx/html;
            #새로고침해도 화면이 뜨도록 없는 경로는 index.html로
            try_files $uri $uri/ /index.html;
        }
    }
}